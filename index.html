<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <div class="form-side">
      <div class="form-box">
        <h1>Sign up</h1>
        <p class="subtitle">Let's create your account</p>

        <form id="form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" />
            <span class="error" id="email-error"></span>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your new password" />
            <span class="error" id="password-error"></span>
          </div>

          <div class="field">
            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" name="confirm" placeholder="Enter confirm password" />
            <span class="error" id="confirm-error"></span>
          </div>

          <label class="terms">
            <input type="checkbox" id="terms" />
            I agree with the Terms and Conditions
          </label>
          <span class="error" id="terms-error"></span>

          <button type="submit" class="btn">Sign Up</button>
          <p class="success" id="success" hidden>Account created successfully!</p>
        </form>

        <p class="login">Already have an account? <a href="#">Sign in</a></p>
      </div>
    </div>

    <div class="image-side">
      <div class="overlay">
        <h2>Welcome</h2>
        <p>Create your account and start your journey with us today.</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
